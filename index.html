    <style>
      @media print {
        /* Oculta tudo que não for a área de impressão designada */
        body {

          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;

        /* Regra para cupons térmicos: remove cabeçalhos/rodapés de URL do navegador */
        @page {
          margin: 0mm;
          size: auto;
        }

        /* Esconde botões, barras de navegação, rodapés e modais de fundo */
        header, nav, footer, button, .print\:hidden, [role="dialog"] > div:first-child {
          display: none !important;
        }

        /* Força quebra de página limpa e evita corte de linhas ao meio */

          break-inside: avoid !important;
